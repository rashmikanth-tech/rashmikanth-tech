name: Update ninja fight

on:
  schedule:
    - cron: "30 23 * * *"   # 5 AM IST, after the snake: a new fight every day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ninja:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Count contributions and draw today's fight
        env:
          # Optional STATS_TOKEN (a PAT with repo read) lets it refresh the language mix from private repos too;
          # without it the saved assets/languages.json is used and only the counts and streak update.
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/ninja.py
      - name: Commit as the Actions bot, so these commits don't count as your contributions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || (git commit -m "Update ninja fight" && git push)
