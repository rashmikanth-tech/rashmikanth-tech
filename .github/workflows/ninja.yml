name: Update ninja score

on:
  schedule:
    - cron: "30 23 * * *"   # 5 AM IST, after the snake
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ninja:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Count contributions and draw the ninja
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/ninja.py
      - name: Commit if the score changed
        run: |
          git config user.name "Rashmikanth G R"
          git config user.email "130748001+rashmikanth-tech@users.noreply.github.com"
          git add assets/ninja.svg
          git diff --cached --quiet || (git commit -m "Update ninja score" && git push)
